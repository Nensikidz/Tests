<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><style>body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style>
<title>Тест по биохимии</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one centered column. Question card on top, the "chain" of numbered question dots (one residue per question) below it. */
  :root {
    --bg: #F2F5F7;
    --surface: #FFFFFF;
    --ink: #14222B;
    --muted: #586873;
    --line: #D3DDE3;
    --accent: #0F6E7C;
    --accent-ink: #FFFFFF;
    --sel: #E0F0F2;
    --ok: #176B3E;
    --ok-bg: #E3F3EA;
    --ok-solid: #1B7A47;
    --bad: #A3231C;
    --bad-bg: #FBE8E6;
    --bad-solid: #B3261E;
    --on-solid: #FFFFFF;
    --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F171C; --surface: #17222A; --ink: #E6EEF2; --muted: #93A4AF; --line: #2A3A45;
      --accent: #4FB3C2; --accent-ink: #0B1A1F; --sel: #173540;
      --ok: #7BD6A1; --ok-bg: #14301F; --ok-solid: #5CC48A;
      --bad: #F4A29B; --bad-bg: #3A1D1B; --bad-solid: #EF7F76; --on-solid: #0B1A1F;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F171C; --surface: #17222A; --ink: #E6EEF2; --muted: #93A4AF; --line: #2A3A45;
    --accent: #4FB3C2; --accent-ink: #0B1A1F; --sel: #173540;
    --ok: #7BD6A1; --ok-bg: #14301F; --ok-solid: #5CC48A;
    --bad: #F4A29B; --bad-bg: #3A1D1B; --bad-solid: #EF7F76; --on-solid: #0B1A1F;
    color-scheme: dark;
  }

  body {
    background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 var(--font-body);
    padding-inline: 16px; padding-block: 20px 48px;
  }
  .wrap { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  h1, h2, h3, p { margin: 0; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .mark, .timer, .hint, .tag, .legend { font-family: var(--font-mono); font-size: 13px; letter-spacing: .04em; color: var(--muted); }
  .mark { text-transform: uppercase; }
  .mark b { color: var(--ink); font-weight: 500; }
  .timer { font-variant-numeric: tabular-nums; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .hero h1 { font-size: clamp(28px, 7vw, 40px); line-height: 1.1; font-weight: 600; text-wrap: balance; }
  .hero .sub { color: var(--muted); max-width: 52ch; }
  .chain-art { width: 100%; max-width: 280px; height: auto; color: var(--accent); }

  .field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
  .field > label, .field > legend { font-weight: 500; padding: 0; }
  .field .opt-note { color: var(--muted); font-weight: 400; }
  input[type="text"] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; }
  .seg label { position: relative; }
  .seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg span { display: block; border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; background: var(--bg); font-variant-numeric: tabular-nums; }
  .seg input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 18px; font-weight: 500; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn[disabled] { opacity: .45; cursor: default; }
  .btn.link { border: 0; background: none; padding: 6px 2px; color: var(--muted); text-decoration: underline; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .note { color: var(--muted); font-size: 14px; }

  .q h2 { font-size: 20px; line-height: 1.35; font-weight: 600; text-wrap: pretty; }
  .q h2:focus { outline: none; }
  .opts { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .opt { display: grid; grid-template-columns: auto auto 1fr; gap: 12px; align-items: start; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; background: var(--surface); }
  .opt:hover { border-color: var(--muted); }
  .opt.sel { background: var(--sel); border-color: var(--accent); }
  .opt.right { background: var(--ok-bg); border-color: var(--ok-solid); }
  .opt.wrong { background: var(--bad-bg); border-color: var(--bad-solid); }
  .opt.done { cursor: default; }
  .fb { border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .fb.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-solid); }
  .fb.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-solid); }
  .fb b { font-weight: 600; }
  .opt input { margin: 3px 0 0; width: 18px; height: 18px; accent-color: var(--accent); }
  .opt .key { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 4px; }
  .opt .txt { min-width: 0; overflow-wrap: anywhere; }
  .pager { display: flex; justify-content: space-between; gap: 10px; }

  .chain h3 { font-size: 14px; font-weight: 500; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .dots { display: flex; flex-wrap: wrap; gap: 6px; }
  .dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; color: var(--muted); font: 500 11px var(--font-mono); display: grid; place-items: center; padding: 0; font-variant-numeric: tabular-nums; }
  .dot.answered { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .dot.ok { background: var(--ok-solid); border-color: var(--ok-solid); color: var(--on-solid); }
  .dot.bad { background: var(--bad-solid); border-color: var(--bad-solid); color: var(--on-solid); }
  .dot.skip { border-style: dashed; border-color: var(--muted); }
  .dot.current { outline: 2px solid var(--ink); outline-offset: 2px; }

  .confirm { border: 1px solid var(--accent); background: var(--sel); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .score .big { font: 500 clamp(44px, 14vw, 72px)/1 var(--font-mono); font-variant-numeric: tabular-nums; }
  .score .big small { font-size: .45em; color: var(--muted); }
  .score .who { color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .stat { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font: 500 22px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .copybox { width: 100%; box-sizing: border-box; font: 14px/1.4 var(--font-mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; resize: none; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters .btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .review { display: flex; flex-direction: column; gap: 12px; }
  .ritem { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; scroll-margin-top: 12px; }
  .ritem header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: baseline; }
  .badge { font: 500 12px var(--font-mono); letter-spacing: .04em; padding: 2px 8px; border-radius: 99px; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.bad { background: var(--bad-bg); color: var(--bad); }
  .badge.skip { background: var(--bg); color: var(--muted); border: 1px dashed var(--muted); }
  .ritem .qt { font-weight: 600; text-wrap: pretty; }
  .ritem ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .ritem li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 0; }
  .ritem li span:first-child { min-width: 0; overflow-wrap: anywhere; }
  .ritem li.right { background: var(--ok-bg); border-color: var(--ok-solid); }
  .ritem li.wrong { background: var(--bad-bg); border-color: var(--bad-solid); }
  .ritem li .tag { white-space: nowrap; font-size: 12px; }
  .ritem li.right .tag { color: var(--ok); }
  .ritem li.wrong .tag { color: var(--bad); }

  @media (max-width: 480px) {
    .card { padding: 16px; }
    .q h2 { font-size: 18px; }
    .ritem li { flex-direction: column; gap: 2px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .opt, .btn, .dot { transition: background-color .12s, border-color .12s; }
  }
</style>

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function rnd(n) {
  try { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function fmtTime(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  const p = n => String(n).padStart(2, '0');
  return (h ? h + ':' : '') + p(m) + ':' + p(r);
}
function plural(n, one, few, many) {
  const m = n % 100, d = n % 10;
  if (m >= 11 && m <= 14) return many;
  return d === 1 ? one : (d >= 2 && d <= 4 ? few : many);
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, S, { sig: SIG, confirm: false }))); } catch (e) {} }
function clearSession() { try { localStorage.removeItem(KEY); } catch (e) {} }
function loadSession() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.sig === SIG && (s.phase === 'test' || s.phase === 'result') && Array.isArray(s.items)) { s.confirm = false; return s; }
  } catch (e) {}
  return null;
}
function isRight(k) {
  const a = S.answers[k], c = BANK[S.items[k].q][3];
  return a.length === c.length && c.every(x => a.includes(x));
}
function grade() {
  let ok = 0, skip = 0;
  S.items.forEach((_, k) => { if (!S.answers[k].length) skip++; else if (isRight(k)) ok++; });
  return { ok, skip, bad: S.items.length - ok - skip, total: S.items.length };
}

/* ---------- start ---------- */
function newTest(indexes, name, mode) {
  const items = indexes.map(i => ({ q: i, order: shuffle(BANK[i][2].map((_, j) => j)) }));
  S = { phase: 'test', name: name || '', mode: mode || 'practice', count: items.length, items, answers: items.map(() => []), checked: items.map(() => false), cur: 0, t0: Date.now(), t1: null };
  save(); render(); window.scrollTo(0, 0);
}

const CHAIN_SVG = '<svg class="chain-art" viewBox="0 0 280 44" role="img" aria-label="Цепочка аминокислотных остатков"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 26 L58 14 L98 30 L138 14 L178 30 L218 14 L258 28" opacity=".55"/><circle cx="18" cy="26" r="7" fill="currentColor"/><circle cx="58" cy="14" r="7"/><circle cx="98" cy="30" r="7" fill="currentColor"/><circle cx="138" cy="14" r="7"/><circle cx="178" cy="30" r="7" fill="currentColor"/><circle cx="218" cy="14" r="7"/><circle cx="258" cy="28" r="7" fill="currentColor"/></g></svg>';

function renderStart() {
  const opts = [20, 30, 50, BANK.length];
  app.innerHTML = `
    <div class="top"><span class="mark">Биохимия</span><span class="mark">${BANK.length} ${plural(BANK.length, 'вопрос', 'вопроса', 'вопросов')} в банке</span></div>
    <section class="card hero">
      ${CHAIN_SVG}
      <h1>Тест по биохимии</h1>
      <p class="sub">Педиатрический факультет. Вопросы и варианты ответов каждый раз идут в новом порядке, в режиме тренировки правильный ответ показывается сразу после ответа, в режиме экзамена разбор появляется после завершения.</p>
      <form id="startForm" class="card" style="padding:16px;background:var(--bg)">
        <div class="field"><label for="nm">Имя <span class="opt-note">(необязательно, попадёт в строку с результатом)</span></label>
          <input type="text" id="nm" maxlength="60" autocomplete="name" value="${esc(S.name || '')}"></div>
        <fieldset class="field"><legend>Сколько вопросов</legend>
          <div class="seg">${opts.map((n, i) => `<label><input type="radio" name="cnt" value="${n}" ${n === BANK.length ? 'checked' : ''}><span>${i === opts.length - 1 ? 'Все ' + n : n}</span></label>`).join('')}</div></fieldset>
        <fieldset class="field"><legend>Режим</legend>
          <div class="seg"><label><input type="radio" name="mode" value="practice" ${S.mode !== 'exam' ? 'checked' : ''}><span>Тренировка: правильный ответ сразу</span></label><label><input type="radio" name="mode" value="exam" ${S.mode === 'exam' ? 'checked' : ''}><span>Экзамен: разбор в конце</span></label></div></fieldset>
        <div class="row"><button class="btn primary" type="submit">Начать тест</button></div>
      </form>
      <p class="note">Вопрос засчитывается, если отмечены все верные варианты и нет лишних. В вопросах с несколькими ответами число верных указано над вариантами.</p>
    </section>`;
}

/* ---------- test ---------- */
function dotClass(k) {
  if (S.phase === 'result') return isRight(k) ? 'ok' : (S.answers[k].length ? 'bad' : 'skip');
  const cur = k === S.cur ? ' current' : '';
  if (S.mode === 'practice' && S.checked && S.checked[k]) return (isRight(k) ? 'ok' : 'bad') + cur;
  return (S.answers[k].length ? 'answered' : '') + cur;
}
function dotsHtml() {
  return S.items.map((_, k) => `<button type="button" class="dot ${dotClass(k)}" data-act="goto" data-i="${k}" aria-label="Вопрос ${k + 1}"${k === S.cur && S.phase === 'test' ? ' aria-current="true"' : ''}>${k + 1}</button>`).join('');
}
function answeredCount() { return S.answers.filter(a => a.length).length; }

function renderTest() {
  const total = S.items.length, k = S.cur, it = S.items[k], q = BANK[it.q], need = q[3].length, a = S.answers[k];
  const type = need > 1 ? 'checkbox' : 'radio';
  const done = S.mode === 'practice' && !!(S.checked && S.checked[k]);
  const right = isRight(k);
  const left = total - answeredCount();
  app.innerHTML = `
    <div class="top"><span class="mark">Вопрос <b>${k + 1}</b> из ${total}</span><span class="timer" id="timer">${fmtTime(Date.now() - S.t0)}</span></div>
    <section class="card q">
      <p class="hint">${need > 1 ? 'Выберите ' + need + ' ответа' : 'Выберите 1 ответ'}${S.mode === 'practice' && !done ? ' · проверка сразу' : ''}</p>
      <h2 id="qt" tabindex="-1">${esc(q[1])}</h2>
      <fieldset class="opts" aria-labelledby="qt">
        ${it.order.map((oi, pos) => `<label class="opt${done ? ' done' + (q[3].includes(oi) ? ' right' : (a.includes(oi) ? ' wrong' : '')) : (a.includes(oi) ? ' sel' : '')}"><input type="${type}" name="opt" value="${oi}"${a.includes(oi) ? ' checked' : ''}${done ? ' disabled' : ''}><span class="key">${pos + 1}</span><span class="txt">${esc(q[2][oi])}</span></label>`).join('')}
      </fieldset>
      ${done ? `<div class="fb ${right ? 'ok' : 'bad'}" role="status"><b>${right ? 'Верно' : 'Неверно'}</b>${right ? '' : '<span>Правильно: ' + q[3].map(i => esc(q[2][i])).join('; ') + '</span>'}</div>` : ''}
    </section>
    <div class="pager">
      <button class="btn" type="button" data-act="prev"${k === 0 ? ' disabled' : ''}>Назад</button>
      ${k === total - 1 ? '<button class="btn primary" type="button" data-act="finish">Завершить</button>' : '<button class="btn primary" type="button" data-act="next">Далее</button>'}
    </div>
    ${S.confirm ? `<div class="confirm" role="alertdialog" aria-label="Завершить тест">
      <p><b>${left ? 'Без ответа: ' + left + '.' : 'На все вопросы есть ответы.'}</b> Завершить тест и показать результат?</p>
      <div class="row"><button class="btn primary" type="button" data-act="finish-yes">Завершить</button><button class="btn" type="button" data-act="finish-no">Вернуться к вопросам</button><button class="btn link" type="button" data-act="abort">Отменить попытку</button></div></div>` : ''}
    <section class="chain card">
      <h3><span>Все вопросы</span><span class="legend" id="legend">отвечено ${answeredCount()} из ${total}</span></h3>
      <div class="dots" id="dots">${dotsHtml()}</div>
      <div class="row"><button class="btn" type="button" data-act="finish">Завершить тест</button></div>
    </section>`;
  clearInterval(timerId);
  timerId = setInterval(() => { const t = document.getElementById('timer'); if (t && S.phase === 'test') t.textContent = fmtTime(Date.now() - S.t0); }, 1000);
}
function refreshDots() {
  const d = document.getElementById('dots'); if (!d) return;
  d.querySelectorAll('.dot').forEach((b, k) => { b.className = 'dot ' + dotClass(k); });
  const l = document.getElementById('legend'); if (l) l.textContent = 'отвечено ' + answeredCount() + ' из ' + S.items.length;
}
function go(i) {
  if (S.phase !== 'test') return;
  S.cur = Math.min(Math.max(i, 0), S.items.length - 1); S.confirm = false; save(); render();
  window.scrollTo(0, 0); const h = document.getElementById('qt'); if (h) h.focus({ preventScroll: true });
}

/* ---------- result ---------- */
function resultText(g) {
  const pct = Math.round(g.ok / g.total * 100);
  const d = new Date(S.t1).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  return (S.name ? S.name + ': ' : '') + 'Биохимия, ' + g.ok + ' из ' + g.total + ' (' + pct + '%), ' + d + ', время ' + fmtTime(S.t1 - S.t0);
}
function reviewHtml() {
  const rows = [];
  S.items.forEach((it, k) => {
    const st = isRight(k) ? 'ok' : (S.answers[k].length ? 'bad' : 'skip');
    if (filter === 'bad' && st === 'ok') return;
    const q = BANK[it.q], a = S.answers[k];
    const label = { ok: 'Верно', bad: 'Неверно', skip: 'Нет ответа' }[st];
    rows.push(`<article class="ritem" id="r${k}"><header><span class="badge ${st}">${label}</span><span class="tag">вопрос ${k + 1} · №${q[0]} в банке</span></header>
      <p class="qt">${esc(q[1])}</p>
      <ul>${it.order.map(oi => {
        const right = q[3].includes(oi), chosen = a.includes(oi);
        const cls = right ? 'right' : (chosen ? 'wrong' : '');
        const tag = right ? (chosen ? '✓ ваш ответ, верно' : 'верный ответ') : (chosen ? '✗ ваш ответ' : '');
        return `<li class="${cls}"><span>${esc(q[2][oi])}</span>${tag ? `<span class="tag">${tag}</span>` : ''}</li>`;
      }).join('')}</ul></article>`);
  });
  return rows.length ? rows.join('') : '<p class="note">Ошибок нет.</p>';
}
function renderResult() {
  clearInterval(timerId); timerId = null;
  const g = grade(), pct = Math.round(g.ok / g.total * 100), wrong = g.bad + g.skip;
  app.innerHTML = `
    <div class="top"><span class="mark">Результат</span><span class="timer">время ${fmtTime(S.t1 - S.t0)}</span></div>
    <section class="card score">
      ${S.name ? `<p class="who">${esc(S.name)}</p>` : ''}
      <p class="big">${g.ok}<small> / ${g.total}</small></p>
      <p><b>${pct}%</b> верных ответов</p>
      <div class="stats">
        <div class="stat"><b>${g.ok}</b><span>верно</span></div>
        <div class="stat"><b>${g.bad}</b><span>неверно</span></div>
        <div class="stat"><b>${g.skip}</b><span>без ответа</span></div>
      </div>
      <div class="row">
        <button class="btn primary" type="button" data-act="copy">Скопировать результат</button>
        ${wrong ? `<button class="btn" type="button" data-act="retry-wrong">Повторить ${wrong} ${plural(wrong, 'вопрос', 'вопроса', 'вопросов')} с ошибками</button>` : ''}
        <button class="btn" type="button" data-act="again">Пройти заново</button>
      </div>
      <div id="copyArea" hidden></div>
    </section>
    <section class="chain card"><h3><span>Карта ответов</span><span class="legend">зелёный верно · красный неверно · пунктир без ответа</span></h3><div class="dots">${dotsHtml()}</div></section>
    <div class="filters" role="group" aria-label="Фильтр разбора">
      <button class="btn" type="button" data-act="filter" data-f="all" aria-pressed="${filter === 'all'}">Все вопросы (${g.total})</button>
      <button class="btn" type="button" data-act="filter" data-f="bad" aria-pressed="${filter === 'bad'}">Только ошибки (${wrong})</button>
    </div>
    <div class="review" id="review">${reviewHtml()}</div>`;
}

function render() {
  clearInterval(timerId); timerId = null;
  if (S.phase === 'test') renderTest(); else if (S.phase === 'result') renderResult(); else renderStart();
}

/* ---------- events ---------- */
app.addEventListener('submit', e => {
  if (e.target.id !== 'startForm') return;
  e.preventDefault();
  const name = document.getElementById('nm').value.trim().slice(0, 60);
  const n = +e.target.elements.cnt.value || BANK.length;
  newTest(shuffle(BANK.map((_, i) => i)).slice(0, n), name, e.target.elements.mode.value);
});

app.addEventListener('change', e => {
  const t = e.target;
  if (t.name !== 'opt' || S.phase !== 'test') return;
  const k = S.cur, oi = +t.value;
  let a = S.answers[k];
  a = t.type === 'radio' ? [oi] : (t.checked ? Array.from(new Set(a.concat(oi))) : a.filter(x => x !== oi));
  S.answers[k] = a;
  if (S.mode === 'practice' && a.length >= BANK[S.items[k].q][3].length) {
    if (!S.checked) S.checked = S.items.map(() => false);
    S.checked[k] = true; save(); render(); return;
  }
  save();
  app.querySelectorAll('.opt').forEach(l => l.classList.toggle('sel', l.querySelector('input').checked));
  refreshDots();
});

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'goto') {
    if (S.phase === 'test') go(+b.dataset.i);
    else { filter = 'all'; render(); const r = document.getElementById('r' + b.dataset.i); if (r) r.scrollIntoView({ block: 'start' }); }
  }
  else if (act === 'prev') go(S.cur - 1);
  else if (act === 'next') go(S.cur + 1);
  else if (act === 'finish') { S.confirm = true; render(); const c = app.querySelector('.confirm'); if (c) c.scrollIntoView({ block: 'center' }); }
  else if (act === 'finish-no') { S.confirm = false; render(); }
  else if (act === 'finish-yes') { S.phase = 'result'; S.confirm = false; S.t1 = Date.now(); filter = 'all'; save(); render(); window.scrollTo(0, 0); }
  else if (act === 'abort') { clearSession(); S = { phase: 'start', name: S.name, mode: S.mode, count: BANK.length }; render(); window.scrollTo(0, 0); }
  else if (act === 'again') { clearSession(); S = { phase: 'start', name: S.name, mode: S.mode, count: BANK.length }; render(); window.scrollTo(0, 0); }
  else if (act === 'retry-wrong') {
    const idx = S.items.map((it, k) => isRight(k) ? -1 : it.q).filter(i => i >= 0);
    newTest(shuffle(idx), S.name, S.mode);
  }
  else if (act === 'filter') { filter = b.dataset.f; render(); }
  else if (act === 'copy') {
    const text = resultText(grade());
    const area = document.getElementById('copyArea');
    const show = () => { area.hidden = false; area.innerHTML = '<textarea class="copybox" rows="2" readonly aria-label="Строка с результатом"></textarea>'; const ta = area.firstChild; ta.value = text; ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(text).then(() => { area.hidden = false; area.innerHTML = '<p class="note">Скопировано: ' + esc(text) + '</p>'; }, show); } catch (err) { show(); }
  }
});

document.addEventListener('keydown', e => {
  if (S.phase !== 'test' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches && e.target.matches('input[type="text"], textarea')) return;
  if (e.key === 'Enter' && S.mode === 'practice' && S.checked && S.checked[S.cur] && e.target.tagName !== 'BUTTON') {
    go(S.cur + 1); e.preventDefault(); return;
  }
  if (/^[1-9]$/.test(e.key)) {
    const inp = app.querySelectorAll('.opt input')[+e.key - 1];
    if (inp) { inp.click(); e.preventDefault(); }
  } else if (e.target.tagName !== 'INPUT') {
    if (e.key === 'ArrowRight') go(S.cur + 1); else if (e.key === 'ArrowLeft') go(S.cur - 1);
  }
});

render();
</script>

</body></html>
